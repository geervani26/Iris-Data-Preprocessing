<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Flower Classification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
            color: #243247;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2457a7;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #93b4f5;
            border-color: #2457a7;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #17427f;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            background: #e8f7ed;
            text-align: center;
        }

        #result h2 {
            color: #176534;
            margin-top: 0;
        }

        #species {
            font-size: 23px;
            font-weight: bold;
            color: #176534;
            text-transform: capitalize;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌸 Iris Flower Classification</h1>

        <p class="description">
            Enter the flower measurements below to predict its species
            using our Machine Learning model.
        </p>

        <form id="predictionForm">

            <div class="form-group">
                <label for="sepal_length">
                    Sepal Length (cm)
                </label>
                <input
                    type="number"
                    id="sepal_length"
                    name="sepal_length"
                    min="0.1"
                    step="any"
                    value="5.1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sepal_width">
                    Sepal Width (cm)
                </label>
                <input
                    type="number"
                    id="sepal_width"
                    name="sepal_width"
                    min="0.1"
                    step="any"
                    value="3.5"
                    required
                >
            </div>

            <div class="form-group">
                <label for="petal_length">
                    Petal Length (cm)
                </label>
                <input
                    type="number"
                    id="petal_length"
                    name="petal_length"
                    min="0.1"
                    step="any"
                    value="1.4"
                    required
                >
            </div>

            <div class="form-group">
                <label for="petal_width">
                    Petal Width (cm)
                </label>
                <input
                    type="number"
                    id="petal_width"
                    name="petal_width"
                    min="0.1"
                    step="any"
                    value="0.2"
                    required
                >
            </div>

            <button type="submit" id="predictButton">
                Predict Flower Species
            </button>

        </form>

        <div id="result" role="status" aria-live="polite">
            <h2>Prediction Successful!</h2>
            <p>Predicted species:</p>
            <p id="species"></p>
        </div>

        <div id="error" role="alert"></div>

        <p class="footer">
            Powered by Python, Flask and Scikit-learn
        </p>

    </div>

    <script>
        const form = document.getElementById("predictionForm");
        const result = document.getElementById("result");
        const errorBox = document.getElementById("error");
        const speciesBox = document.getElementById("species");
        const predictButton = document.getElementById("predictButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            result.style.display = "none";
            errorBox.style.display = "none";

            const measurements = {
                sepal_length: Number(document.getElementById("sepal_length").value),
                sepal_width: Number(document.getElementById("sepal_width").value),
                petal_length: Number(document.getElementById("petal_length").value),
                petal_width: Number(document.getElementById("petal_width").value)
            };

            predictButton.disabled = true;
            predictButton.textContent = "Predicting...";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(measurements)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Prediction failed.");
                }

                speciesBox.textContent = data.predicted_species;
                result.style.display = "block";

            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.style.display = "block";

            } finally {
                predictButton.disabled = false;
                predictButton.textContent = "Predict Flower Species";
            }
        });
    </script>

</body>
</html>
